name: Crea APK Android

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Scarica il codice
        uses: actions/checkout@v4

      - name: 2. Configura Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Configura Java 21 per Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Installa dipendenze e compila Web App
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "mia-app-clienti";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          npm install --legacy-peer-deps
          npx vite build --base=./

     - name: 5. Trasforma in App Android con Capacitor e applica Icona
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets --legacy-peer-deps
          rm -rf android capacitor.config.json capacitor.config.ts
          npx cap init "GKAnalyst Premium" "com.gkanalyst.premium" --web-dir dist
          npx cap add android
          # Se è presente icon.png, genera automaticamente tutte le icone Android
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            cp icon.png assets/splash.png
            npx capacitor-assets generate --android
          fi
          npx cap sync android

      - name: 6. Genera il file APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 7. Carica APK pronto per il download
        uses: actions/upload-artifact@v4
        with:
          name: App-Pronta-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
